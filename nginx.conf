server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # CSS e JS: o navegador revalida a cada visita (usa o cache só se não mudou)
  location ~* \.(css|js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|mp4)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}
